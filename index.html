<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Noahs Spiele-Werkstatt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>🎮 Noahs Spiele-Werkstatt</h1>
</header>

<!-- HOME SCREEN -->
<section id="screen-home" class="screen">
  <button id="btn-new-game" class="big-btn primary">➕ Neues Spiel bauen</button>
  <h2>Meine Spiele</h2>
  <div id="game-list" class="game-list"></div>
  <p id="empty-hint" class="hint">Du hast noch kein Spiel gebaut. Los geht's! 🚀</p>
</section>

<!-- NEW GAME: SIZE PICKER -->
<section id="screen-newgame" class="screen hidden">
  <h2>Wie groß soll dein Spiel sein?</h2>
  <div class="size-options">
    <button class="big-btn size-btn" data-size="8">Klein<br><span>8×8</span></button>
    <button class="big-btn size-btn" data-size="10">Mittel<br><span>10×10</span></button>
    <button class="big-btn size-btn" data-size="12">Groß<br><span>12×12</span></button>
  </div>
  <button id="btn-cancel-new" class="big-btn secondary">⬅ Zurück</button>
</section>

<!-- EDITOR SCREEN -->
<section id="screen-editor" class="screen hidden">
  <h2>🛠️ Baue dein Spiel</h2>
  <input id="game-name" class="name-input" placeholder="Name deines Spiels" maxlength="30">

  <div class="palette" id="palette"></div>
  <p id="editor-status" class="hint"></p>

  <div id="editor-grid" class="grid"></div>

  <div class="editor-actions">
    <button id="btn-save-game" class="big-btn primary">💾 Speichern</button>
    <button id="btn-cancel-editor" class="big-btn secondary">⬅ Zurück</button>
  </div>
</section>

<!-- PLAY SCREEN -->
<section id="screen-play" class="screen hidden">
  <h2 id="play-title">🕹️ Spielen</h2>
  <div class="hud">
    <span id="score-display">🪙 0 / 0</span>
    <span id="play-message"></span>
  </div>

  <div id="play-grid" class="grid"></div>

  <div class="dpad">
    <button id="dpad-up" class="dpad-btn">⬆️</button>
    <div class="dpad-row">
      <button id="dpad-left" class="dpad-btn">⬅️</button>
      <button id="dpad-down" class="dpad-btn">⬇️</button>
      <button id="dpad-right" class="dpad-btn">➡️</button>
    </div>
  </div>

  <div class="editor-actions">
    <button id="btn-restart-play" class="big-btn secondary">🔄 Neu starten</button>
    <button id="btn-back-play" class="big-btn secondary">⬅ Zurück</button>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
